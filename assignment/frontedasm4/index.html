<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ShopDynamic - E-Commerce Store</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <!-- Navbar -->
  <nav class="navbar navbar-expand-lg navbar-light bg-white border-bottom sticky-top">
    <div class="container-fluid px-4">
      <a class="navbar-brand fw-bold d-flex align-items-center gap-2" href="#">
        <i class="bi bi-bag-fill fs-4"></i>
        <span>ShopDynamic</span>
      </a>
      <ul class="navbar-nav me-auto mb-2 mb-lg-0 flex-row gap-3">
        <li class="nav-item"><a class="nav-link active" href="#productsSection">Home</a></li>
        <li class="nav-item"><a class="nav-link" href="#productsSection">Shop</a></li>
        <li class="nav-item"><a class="nav-link" href="#cartSection">About</a></li>
      </ul>
      <button class="btn btn-outline-dark position-relative" type="button" onclick="focusCart()">
        <i class="bi bi-cart3 fs-5"></i>
        <span id="navBadge" class="position-absolute top-0 start-100 translate-middle badge rounded-pill bg-success">0</span>
      </button>
    </div>
  </nav>

  <!-- Main Content: Left Products + Right Shopping Cart -->
  <div class="container-fluid px-4 py-4">
    <div class="row g-4 align-items-start">
      <!-- Left: Product Grid -->
      <div class="col-lg-8" id="productsSection">
        <div id="productGrid" class="row row-cols-1 row-cols-sm-2 row-cols-md-3 g-4"></div>
      </div>

      <!-- Right: Shopping Cart -->
      <div class="col-lg-4" id="cartSection">
        <div class="card cart-panel border-0 shadow-sm">
          <div class="card-header bg-white border-bottom d-flex justify-content-between align-items-center py-3">
            <h5 class="mb-0 fw-semibold">Shopping Cart</h5>
            <button type="button" class="btn-close" aria-label="Clear Cart" onclick="clearCart()" title="Clear Cart"></button>
          </div>

          <div class="card-body" id="cartItemsContainer">
            <p class="text-muted text-center my-4">Your cart is empty. Click "Add to Cart" on any available product.</p>
          </div>

          <div class="card-footer bg-white border-top p-3">
            <h6 class="fw-bold mb-3">Cart Total</h6>
            <div class="d-flex justify-content-between mb-2">
              <span class="text-muted">Items:</span>
              <span id="totalItems" class="fw-semibold">0</span>
            </div>
            <div class="d-flex justify-content-between align-items-center p-2 rounded grand-total-box mb-3">
              <span class="fw-bold">Grand Total:</span>
              <span id="grandTotal" class="fw-bold fs-5">₹0</span>
            </div>
            <button type="button" class="btn btn-success w-100 py-2 fw-semibold" onclick="checkout()">
              Proceed to Checkout
            </button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
